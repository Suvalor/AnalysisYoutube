<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="#16213e" stroke-width="1"/>
  <!-- Inner circle ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#0f3460" stroke-width="1.5" opacity="0.6"/>
  <!-- Compass tick marks (N/E/S/W) -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="32" x2="54" y2="32" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="58" x2="32" y2="54" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <!-- Minor tick marks -->
  <line x1="50.2" y1="13.8" x2="47.8" y2="16.2" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50.2" y1="50.2" x2="47.8" y2="47.8" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13.8" y1="50.2" x2="16.2" y2="47.8" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13.8" y1="13.8" x2="16.2" y2="16.2" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- North pointer (red/warm) -->
  <polygon points="32,10 28,30 32,26 36,30" fill="#ef4444" opacity="0.95"/>
  <!-- South pointer (blue/cool) -->
  <polygon points="32,54 28,34 32,38 36,34" fill="#3b82f6" opacity="0.85"/>
  <!-- East pointer -->
  <polygon points="54,32 34,28 38,32 34,36" fill="#6366f1" opacity="0.7"/>
  <!-- West pointer -->
  <polygon points="10,32 30,28 26,32 30,36" fill="#6366f1" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#f8fafc"/>
  <circle cx="32" cy="32" r="1.5" fill="#1a1a2e"/>
  <!-- N label -->
  <text x="32" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ef4444">N</text>
</svg>
