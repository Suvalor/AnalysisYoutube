# MySQL 使用与后端相同思路的 Hub 同步源，避免首次 pull 时访问 docker.io 超时
services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: creator_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: creator_saas
      MYSQL_USER: creator
      MYSQL_PASSWORD: creator123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creator_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USER: creator
      MYSQL_PASSWORD: creator123
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: creator_saas
      DATABASE_URL: mysql+asyncmy://creator:creator123@mysql:3306/creator_saas
      SECRET_KEY: change_this_to_a_strong_random_string
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      BACKEND_CORS_ORIGINS: http://localhost:5173
      YOUTUBE_API_KEY: AIzaSyDvV1f8rkiO6VFHj33M5gU3h_dV_kAFKdM
      VOLCENGINE_API_KEY: cb1ae748-a74f-48ef-b057-debfed45e2c4
      VOLCENGINE_ENDPOINT_ID: minimax-m2.5
      VOLCENGINE_BASE_URL: https://ark.cn-beijing.volces.com/api/coding
      ALIYUN_ACCESS_KEY_ID: LTAI5tLpJRy1E5eeUkg8csgm
      ALIYUN_ACCESS_KEY_SECRET: mriIs1IwxIYqsdpSjpYXwYAlKNbeWe
      ALIYUN_ROLE_ARN: acs:ram::1379506082945137:user/suvalor
      ALIYUN_REGION_ID: cn-guangzhou
      ALIYUN_OSS_BUCKET_NAME: savor-tool
      ALIYUN_OSS_ENDPOINT: oss-cn-guangzhou.aliyuncs.com
    ports:
      - "8000:8000"

volumes:
  mysql_data:

