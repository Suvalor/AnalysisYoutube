services:
  mysql:
    image: mysql:8.0
    container_name: creator_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: creator_saas
      MYSQL_USER: creator
      MYSQL_PASSWORD: creator123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creator_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USER: creator
      MYSQL_PASSWORD: creator123
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: creator_saas
      DATABASE_URL: mysql+asyncmy://creator:creator123@mysql:3306/creator_saas
      SECRET_KEY: change_this_to_a_strong_random_string
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      BACKEND_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

volumes:
  mysql_data:

