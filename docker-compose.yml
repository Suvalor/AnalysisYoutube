# MySQL 使用与后端相同思路的 Hub 同步源，避免首次 pull 时访问 docker.io 超时
services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: creator_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: creator_saas
      MYSQL_USER: creator
      MYSQL_PASSWORD: creator123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 与 Dockerfile 一致：apt 默认走清华 Debian 源，避免 deb.debian.org 502；海外可设 APT_USE_MIRROR=0
      args:
        APT_USE_MIRROR: "1"
    container_name: creator_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USER: creator
      MYSQL_PASSWORD: creator123
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: creator_saas
      DATABASE_URL: mysql+asyncmy://creator:creator123@mysql:3306/creator_saas
      SECRET_KEY: change_this_to_a_strong_random_string
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # 兼容本地开发：不同机器/配置可能导致前端 Origin 在 localhost/127.0.0.1、5173/5174 之间切换
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      VOLCENGINE_ENDPOINT_ID: ${VOLCENGINE_ENDPOINT_ID:-doubao-seed-2.0-pro}
      VOLCENGINE_BASE_URL: ${VOLCENGINE_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      VOLCENGINE_MODEL_GEMINI: ${VOLCENGINE_MODEL_GEMINI:-gemini-1.5-pro}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_ROLE_ARN: ${ALIYUN_ROLE_ARN:-}
      ALIYUN_REGION_ID: ${ALIYUN_REGION_ID:-cn-guangzhou}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-guangzhou.aliyuncs.com}
    ports:
      - "8000:8000"
    # 挂载本地 backend：容器内 Alembic/应用代码与仓库一致；宿主 entrypoint.sh 须可执行（chmod +x）
    # 纯镜像部署到生产时，请删除本 volumes 段并仅使用 build 产物镜像
    volumes:
      - ./backend:/app

volumes:
  mysql_data:

